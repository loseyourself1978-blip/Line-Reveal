<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Line Reveal v1.2.6 自动化测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 22px; font-weight: 800; color: #facc15; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .summary-item { background: #1e293b; border-radius: 12px; padding: 12px 20px; min-width: 100px; }
  .summary-item .num { font-size: 28px; font-weight: 900; }
  .summary-item .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }
  .total { color: #e2e8f0; }
  .passed { color: #22c55e; }
  .failed { color: #ef4444; }
  .pending { color: #94a3b8; }
  button { padding: 10px 28px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 14px; }
  #runBtn { background: #facc15; color: #0f172a; }
  #runBtn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .section { margin-bottom: 24px; }
  .section-title { font-size: 14px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; padding-left: 4px; border-left: 3px solid #334155; padding-left: 10px; }
  .test-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-radius: 10px; margin-bottom: 6px; background: #1e293b; }
  .test-row.running { background: #1e3a5f; }
  .test-row.pass { background: #14532d22; border: 1px solid #22c55e33; }
  .test-row.fail { background: #7f1d1d22; border: 1px solid #ef444433; }
  .test-row.skip { background: #1e293b; opacity: .55; }
  .badge { min-width: 60px; text-align: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
  .badge.auto { background: #1d4ed8; color: #bfdbfe; }
  .badge.manual { background: #78350f; color: #fde68a; }
  .badge.pass { background: #14532d; color: #86efac; }
  .badge.fail { background: #7f1d1d; color: #fca5a5; }
  .badge.running { background: #1e3a5f; color: #93c5fd; animation: pulse 1s infinite; }
  .badge.skip { background: #334155; color: #94a3b8; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .test-id { font-size: 11px; color: #64748b; font-weight: 700; min-width: 62px; flex-shrink: 0; }
  .test-name { font-size: 13px; font-weight: 600; flex: 1; }
  .test-desc { font-size: 11px; color: #64748b; flex: 2; }
  .test-result { font-size: 11px; min-width: 160px; text-align: right; }
  .test-result.pass { color: #22c55e; }
  .test-result.fail { color: #ef4444; }
  .log { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #94a3b8; max-height: 200px; overflow-y: auto; margin-top: 16px; white-space: pre-wrap; }
  progress { width: 100%; height: 6px; border-radius: 3px; margin-bottom: 16px; }
  progress::-webkit-progress-bar { background: #1e293b; border-radius: 3px; }
  progress::-webkit-progress-value { background: #facc15; border-radius: 3px; }
</style>
</head>
<body>
<h1>🧪 Line Reveal v1.2.6 自动化测试</h1>
<p class="subtitle">重构版本验收 · 白屏防护 + 精灵碰撞 + 命系统 · <span id="timestamp"></span></p>

<div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
  <button id="runBtn" onclick="runAll()">▶ 开始自动测试</button>
  <button onclick="resetAll()" style="background:#334155;color:#e2e8f0;">↺ 重置</button>
</div>

<progress id="progress" value="0" max="100"></progress>

<div class="summary">
  <div class="summary-item"><div class="num total" id="numTotal">0</div><div class="label">总计</div></div>
  <div class="summary-item"><div class="num passed" id="numPass">0</div><div class="label">通过</div></div>
  <div class="summary-item"><div class="num failed" id="numFail">0</div><div class="label">失败</div></div>
  <div class="summary-item"><div class="num pending" id="numSkip">0</div><div class="label">手动</div></div>
</div>

<div id="sections"></div>
<div class="log" id="log">等待测试启动...</div>

<script>
document.getElementById('timestamp').textContent = new Date().toLocaleString('zh-CN');

// ─── 测试定义 ──────────────────────────────────────────────────────────────
const TESTS = [
  // ── WS 白屏防护 ──────────────────────────────────────────────────────────
  { id:'WS-01', cat:'白屏防护', name:'endGame 单次触发', type:'auto',
    desc:'gameEndedRef 保证 endGame 只调用一次',
    test: async () => {
      let callCount = 0;
      const gameEndedRef = { current: false };
      const endGame = () => { callCount++; };
      const triggerEndGame = (won) => {
        if (gameEndedRef.current) return;
        gameEndedRef.current = true;
        endGame(won);
      };
      triggerEndGame(false);
      triggerEndGame(false);
      triggerEndGame(true);
      if (callCount !== 1) throw new Error(`endGame 被调用了 ${callCount} 次，应为 1 次`);
    }
  },
  { id:'WS-02', cat:'白屏防护', name:'syncInterval 立即清零', type:'auto',
    desc:'triggerEndGame 后 syncIntervalRef 必须为 null',
    test: async () => {
      let cleared = false;
      const syncIntervalRef = { current: 999 };
      const gameEndedRef = { current: false };
      const triggerEndGame = () => {
        if (gameEndedRef.current) return;
        gameEndedRef.current = true;
        if (syncIntervalRef.current) { cleared = true; syncIntervalRef.current = null; }
      };
      triggerEndGame();
      if (!cleared) throw new Error('syncInterval 未被清除');
      if (syncIntervalRef.current !== null) throw new Error('syncIntervalRef 未置 null');
    }
  },
  { id:'WS-03', cat:'白屏防护', name:'won/lost 状态不挂载 GameCanvas', type:'auto',
    desc:'App.tsx 只有 playing 状态才渲染 GameCanvas',
    test: async () => {
      const r = await fetch('/src/App.tsx');
      const code = await r.text();
      if (!code.includes("status === 'won' || status === 'lost'")) throw new Error('未找到 won/lost 分支隔离');
      if (!code.includes('<ResultScreen />')) throw new Error('未找到 ResultScreen');
      const dancingIdx = code.indexOf("status === 'dancing'");
      const wonIdx = code.indexOf("status === 'won'");
      if (dancingIdx < 0 || wonIdx < 0) throw new Error('缺少 dancing/won 分支');
    }
  },
  { id:'WS-04', cat:'白屏防护', name:'syncInterval 检查 gameEndedRef 跳出', type:'auto',
    desc:'interval 回调先检查 gameEndedRef，已结束则直接 return',
    test: async () => {
      const r = await fetch('/src/game/GameCanvas.tsx');
      const code = await r.text();
      if (!code.includes('gameEndedRef.current')) throw new Error('未找到 gameEndedRef.current 检查');
      if (!code.includes('if (gameEndedRef.current) return')) throw new Error('interval 未做 gameEndedRef 早退检查');
    }
  },
  { id:'WS-05', cat:'白屏防护', name:'胜利路径停止 interval', type:'auto',
    desc:'胜利判定后立即 clearInterval，不依赖 cleanup',
    test: async () => {
      const r = await fetch('/src/game/GameCanvas.tsx');
      const code = await r.text();
      const victoryBlock = code.slice(code.indexOf('unlockThreshold'));
      if (!victoryBlock.includes('clearInterval')) throw new Error('胜利分支未调用 clearInterval');
    }
  },
  { id:'WS-06', cat:'白屏防护', name:'超时路径立即终止', type:'auto',
    desc:'timeLeft<=0 → triggerEndGame(false) → clearInterval + engine.stop',
    test: async () => {
      const r = await fetch('/src/game/GameCanvas.tsx');
      const code = await r.text();
      if (!code.includes('timeoutFiredRef.current = true')) throw new Error('缺少 timeoutFiredRef 保护');
      if (!code.includes('triggerEndGame(false)')) throw new Error('超时未调用 triggerEndGame');
    }
  },
  { id:'WS-07', cat:'白屏防护', name:'精灵碰撞 → FAILED（模拟器手动）', type:'manual',
    desc:'进第1关，让精灵碰到玩家2次（或命耗尽），必须出现 FAILED 界面，不白屏'
  },
  { id:'WS-08', cat:'白屏防护', name:'通关 → dancing → won（模拟器手动）', type:'manual',
    desc:'正常通关，热舞后必须出现 UNVEILED 界面，不白屏'
  },

  // ── COL 碰撞系统 ────────────────────────────────────────────────────────
  { id:'COL-01', cat:'碰撞系统', name:'engine.hitCount 字段存在', type:'auto',
    test: async () => {
      const r = await fetch('/src/game/engine.ts');
      const code = await r.text();
      if (!code.includes('public hitCount = 0')) throw new Error('engine 缺少 public hitCount = 0');
    }
  },
  { id:'COL-02', cat:'碰撞系统', name:'碰撞检测在 update() 每帧运行', type:'auto',
    test: async () => {
      const r = await fetch('/src/game/engine.ts');
      const code = await r.text();
      if (!code.includes('collisionCooldown')) throw new Error('缺少 collisionCooldown');
      if (!code.includes('this.hitCount++')) throw new Error('缺少 this.hitCount++ 碰撞记录');
      if (!code.includes('PLAYER_RADIUS')) throw new Error('缺少 PLAYER_RADIUS 定义');
    }
  },
  { id:'COL-03', cat:'碰撞系统', name:'碰撞冷却防重复扣命', type:'auto',
    test: async () => {
      // 模拟冷却逻辑
      let hitCount = 0;
      let cooldown = 0;
      const dt = 0.016;
      const checkCollision = (shouldHit) => {
        if (cooldown > 0) { cooldown -= dt; return; }
        if (shouldHit) { hitCount++; cooldown = 0.5; }
      };
      // 连续10帧碰撞，只应记录1次
      for (let i = 0; i < 10; i++) checkCollision(true);
      if (hitCount !== 1) throw new Error(`冷却失效：hitCount=${hitCount}，应为 1`);
    }
  },
  { id:'COL-04', cat:'碰撞系统', name:'syncInterval 读 hitCount → spendLife', type:'auto',
    test: async () => {
      const r = await fetch('/src/game/GameCanvas.tsx');
      const code = await r.text();
      if (!code.includes('engine.hitCount > 0')) throw new Error('syncInterval 未监控 engine.hitCount');
      if (!code.includes('engine.hitCount = 0')) throw new Error('hitCount 未在读取后清零');
      if (!code.includes('spendLife')) throw new Error('未调用 spendLife()');
    }
  },
  { id:'COL-05', cat:'碰撞系统', name:'spendLife 返回 0 → triggerEndGame', type:'auto',
    test: async () => {
      const r = await fetch('/src/game/GameCanvas.tsx');
      const code = await r.text();
      if (!code.includes('remaining === 0')) throw new Error('未检查 remaining === 0');
      if (!code.includes('triggerEndGame(false)')) throw new Error('命耗尽未调用 triggerEndGame(false)');
    }
  },

  // ── LV 命系统 ─────────────────────────────────────────────────────────
  { id:'LV-01', cat:'命系统', name:'SaveData 包含 livesData 字段', type:'auto',
    test: async () => {
      const r = await fetch('/src/hooks/usePersistence.ts');
      const code = await r.text();
      if (!code.includes('livesData')) throw new Error('SaveData 缺少 livesData');
      if (!code.includes('cooldownEndsAt')) throw new Error('缺少 cooldownEndsAt');
      if (!code.includes('consecutiveLosses')) throw new Error('缺少 consecutiveLosses');
    }
  },
  { id:'LV-02', cat:'命系统', name:'spendLife 逻辑正确', type:'auto',
    test: async () => {
      // 模拟 spendLife 核心逻辑
      const COOLDOWN_MINUTES = [5, 15, 30, 60, 120, 240, 480];
      const spendLife = (ld) => {
        if (ld.cooldownEndsAt > 0 && Date.now() < ld.cooldownEndsAt) return { result: -1, ld };
        const newCount = Math.max(0, ld.count - 1);
        const newLosses = ld.consecutiveLosses + 1;
        const cooldownIdx = Math.min(newLosses - 1, COOLDOWN_MINUTES.length - 1);
        const cooldownEndsAt = newCount === 0 ? Date.now() + COOLDOWN_MINUTES[cooldownIdx] * 60_000 : 0;
        return { result: newCount, ld: { count: newCount, cooldownEndsAt, consecutiveLosses: newLosses } };
      };
      let ld = { count: 3, cooldownEndsAt: 0, consecutiveLosses: 0 };
      let r = spendLife(ld); ld = r.ld;
      if (r.result !== 2) throw new Error(`3命→扣1→应得2，实得${r.result}`);
      r = spendLife(ld); ld = r.ld;
      r = spendLife(ld); ld = r.ld;
      if (r.result !== 0) throw new Error(`命耗尽应得0，实得${r.result}`);
      if (ld.cooldownEndsAt <= 0) throw new Error('命耗尽未启动冷却');
      const cooldownMs = ld.cooldownEndsAt - Date.now();
      const expectedMs = 5 * 60_000;
      if (Math.abs(cooldownMs - expectedMs) > 2000) throw new Error(`第1次冷却应为5分钟，实得${Math.round(cooldownMs/60000)}分钟`);
    }
  },
  { id:'LV-03', cat:'命系统', name:'earnLife 重置冷却', type:'auto',
    test: async () => {
      const MAX_LIVES = 20;
      const earnLife = (ld) => ({
        count: Math.min(MAX_LIVES, ld.count + 1),
        cooldownEndsAt: 0,
        consecutiveLosses: 0,
      });
      const ld = { count: 0, cooldownEndsAt: Date.now() + 999999, consecutiveLosses: 5 };
      const after = earnLife(ld);
      if (after.count !== 1) throw new Error(`earnLife 后命数应为 1，实得 ${after.count}`);
      if (after.cooldownEndsAt !== 0) throw new Error('earnLife 未清除冷却');
      if (after.consecutiveLosses !== 0) throw new Error('earnLife 未重置连败计数');
    }
  },
  { id:'LV-04', cat:'命系统', name:'hasLives 判断正确', type:'auto',
    test: async () => {
      const hasLives = (ld) => {
        if (ld.count > 0) return true;
        if (ld.cooldownEndsAt > 0 && Date.now() >= ld.cooldownEndsAt) return true;
        return false;
      };
      if (!hasLives({ count: 3, cooldownEndsAt: 0, consecutiveLosses: 0 })) throw new Error('有命时 hasLives 应返回 true');
      if (hasLives({ count: 0, cooldownEndsAt: Date.now() + 999999, consecutiveLosses: 1 })) throw new Error('冷却中 hasLives 应返回 false');
      if (!hasLives({ count: 0, cooldownEndsAt: Date.now() - 1000, consecutiveLosses: 1 })) throw new Error('冷却已结束 hasLives 应返回 true');
    }
  },
  { id:'LV-05', cat:'命系统', name:'冷却递增（连续失败）', type:'auto',
    test: async () => {
      const COOLDOWN_MINUTES = [5, 15, 30, 60, 120, 240, 480];
      let ld = { count: 1, cooldownEndsAt: 0, consecutiveLosses: 0 };
      const spendLife = (l) => {
        const newCount = Math.max(0, l.count - 1);
        const newLosses = l.consecutiveLosses + 1;
        const idx = Math.min(newLosses - 1, COOLDOWN_MINUTES.length - 1);
        const cooldownEndsAt = newCount === 0 ? Date.now() + COOLDOWN_MINUTES[idx] * 60_000 : 0;
        return { result: newCount, ld: { count: newCount, cooldownEndsAt, consecutiveLosses: newLosses } };
      };
      // 第1次：5分钟
      let r = spendLife(ld); ld = r.ld;
      const cd1 = Math.round((ld.cooldownEndsAt - Date.now()) / 60000);
      if (cd1 !== 5) throw new Error(`第1次冷却应为5分钟，实得${cd1}`);
      // 恢复1命再失败第2次：15分钟
      ld = { count: 1, cooldownEndsAt: 0, consecutiveLosses: 1 };
      r = spendLife(ld); ld = r.ld;
      const cd2 = Math.round((ld.cooldownEndsAt - Date.now()) / 60000);
      if (cd2 !== 15) throw new Error(`第2次冷却应为15分钟，实得${cd2}`);
    }
  },
  { id:'LV-06', cat:'命系统', name:'MAX_LIVES = 20，不可超上限', type:'auto',
    test: async () => {
      const MAX_LIVES = 20;
      const earnLife = (count) => Math.min(MAX_LIVES, count + 1);
      if (earnLife(20) !== 20) throw new Error('超过 MAX_LIVES 上限');
      if (earnLife(19) !== 20) throw new Error('未到 MAX_LIVES 未正常加命');
    }
  },

  // ── GS 游戏状态 ──────────────────────────────────────────────────────────
  { id:'GS-01', cat:'游戏状态', name:'useGame 暴露命系统函数', type:'auto',
    test: async () => {
      const r = await fetch('/src/hooks/useGame.tsx');
      const code = await r.text();
      for (const fn of ['spendLife', 'earnLife', 'hasLives', 'checkAndRestoreLives', 'getCooldownRemaining']) {
        if (!code.includes(fn)) throw new Error(`useGame 缺少 ${fn}`);
      }
    }
  },
  { id:'GS-02', cat:'游戏状态', name:'endGame won → dancing 状态', type:'auto',
    test: async () => {
      const r = await fetch('/src/hooks/useGame.tsx');
      const code = await r.text();
      if (!code.includes("setStatus(won ? 'dancing' : 'lost')")) throw new Error('endGame 未正确切换到 dancing 状态');
    }
  },
  { id:'GS-03', cat:'游戏状态', name:'GameShell 状态机完整', type:'auto',
    test: async () => {
      const r = await fetch('/src/App.tsx');
      const code = await r.text();
      for (const s of ["'welcome'", "'all_passed'", "'dancing'", "'won'", "'lost'"]) {
        if (!code.includes(s)) throw new Error(`App.tsx 缺少 ${s} 分支`);
      }
    }
  },

  // ── BL 构建 ──────────────────────────────────────────────────────────────
  { id:'BL-01', cat:'构建', name:'dist/index.html 存在', type:'auto',
    test: async () => {
      const r = await fetch('/dist/index.html');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
    }
  },
  { id:'BL-02', cat:'构建', name:'JS bundle ≤ 400KB', type:'auto',
    test: async () => {
      const r = await fetch('/dist/index.html');
      const html = await r.text();
      const m = html.match(/src="(\/assets\/index-[^"]+\.js)"/);
      if (!m) throw new Error('未找到 JS bundle');
      const js = await fetch(m[1]);
      const buf = await js.arrayBuffer();
      const kb = buf.byteLength / 1024;
      if (kb > 400) throw new Error(`Bundle ${kb.toFixed(0)}KB > 400KB`);
    }
  },

  // ── MN 手动验证 ──────────────────────────────────────────────────────────
  { id:'MN-01', cat:'手动验证', name:'第1关精灵碰1次 → 命-1', type:'manual',
    desc:'进第1关，让精灵碰到玩家，右上角命数减少1'
  },
  { id:'MN-02', cat:'手动验证', name:'命耗尽 → FAILED 界面，不白屏', type:'manual',
    desc:'耗尽所有命（速度设3命最少），出现 FAILED 界面'
  },
  { id:'MN-03', cat:'手动验证', name:'Try Again 命数检查', type:'manual',
    desc:'FAILED 后点 Try Again，有命则重新开始，无命则提示等待'
  },
  { id:'MN-04', cat:'手动验证', name:'通关 → 热舞 → UNVEILED，不白屏', type:'manual',
    desc:'正常通关，热舞动画完整播放，结算界面正常显示'
  },
  { id:'MN-05', cat:'手动验证', name:'Next Artwork 流程不白屏', type:'manual',
    desc:'结算后点 Next Artwork，下一关正常进入'
  },
];

// ─── 状态 ─────────────────────────────────────────────────────────────────
const state = {};
TESTS.forEach(t => state[t.id] = t.type === 'manual' ? 'skip' : 'pending');

// ─── 渲染 ─────────────────────────────────────────────────────────────────
function render() {
  const cats = [...new Set(TESTS.map(t => t.cat))];
  const container = document.getElementById('sections');
  container.innerHTML = '';
  cats.forEach(cat => {
    const tests = TESTS.filter(t => t.cat === cat);
    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `<div class="section-title">${cat} (${tests.length})</div>`;
    tests.forEach(t => {
      const s = state[t.id];
      const row = document.createElement('div');
      row.className = `test-row ${s === 'pass' ? 'pass' : s === 'fail' ? 'fail' : s === 'running' ? 'running' : s === 'skip' ? 'skip' : ''}`;
      row.id = `row-${t.id}`;
      row.innerHTML = `
        <span class="test-id">${t.id}</span>
        <span class="badge ${s === 'skip' ? 'manual' : s === 'running' ? 'running' : s === 'pass' ? 'pass' : s === 'fail' ? 'fail' : t.type}">${
          s === 'skip' ? '手动' : s === 'running' ? '运行中' : s === 'pass' ? '✓ 通过' : s === 'fail' ? '✗ 失败' : t.type === 'auto' ? '自动' : '手动'
        }</span>
        <span class="test-name">${t.name}</span>
        <span class="test-desc">${t.desc || ''}</span>
        <span class="test-result ${s}" id="res-${t.id}">${s === 'pass' ? '通过' : s === 'fail' ? (t._err || '失败') : s === 'skip' ? '需手动' : '等待'}</span>
      `;
      div.appendChild(row);
    });
    container.appendChild(div);
  });
  updateSummary();
}

function updateSummary() {
  const vals = Object.values(state);
  const auto = TESTS.filter(t => t.type === 'auto').length;
  document.getElementById('numTotal').textContent = auto;
  document.getElementById('numPass').textContent = vals.filter(v => v === 'pass').length;
  document.getElementById('numFail').textContent = vals.filter(v => v === 'fail').length;
  document.getElementById('numSkip').textContent = TESTS.filter(t => t.type === 'manual').length;
  const done = vals.filter(v => v === 'pass' || v === 'fail').length;
  document.getElementById('progress').value = auto > 0 ? (done / auto * 100) : 0;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += `[${new Date().toLocaleTimeString('zh-CN')}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

// ─── 运行 ─────────────────────────────────────────────────────────────────
async function runAll() {
  document.getElementById('runBtn').disabled = true;
  document.getElementById('log').textContent = '';
  log('开始自动测试...');

  const autoTests = TESTS.filter(t => t.type === 'auto');
  for (const t of autoTests) {
    state[t.id] = 'running';
    render();
    log(`运行 ${t.id}: ${t.name}`);
    try {
      await t.test();
      state[t.id] = 'pass';
      log(`  ✓ 通过`);
    } catch(e) {
      state[t.id] = 'fail';
      t._err = e.message.substring(0, 60);
      log(`  ✗ 失败: ${e.message}`);
    }
    render();
    await new Promise(r => setTimeout(r, 80));
  }

  const passed = Object.values(state).filter(v => v === 'pass').length;
  const failed = Object.values(state).filter(v => v === 'fail').length;
  log(`\n完成：${passed} 通过 / ${failed} 失败 / ${TESTS.filter(t=>t.type==='manual').length} 手动待验`);
  if (failed === 0) log('✅ 所有自动化测试通过！请按手动用例在模拟器验证剩余功能。');
  else log('❌ 有失败用例，请查看上方详情。');

  document.getElementById('runBtn').disabled = false;
}

function resetAll() {
  TESTS.forEach(t => { state[t.id] = t.type === 'manual' ? 'skip' : 'pending'; t._err = ''; });
  document.getElementById('log').textContent = '等待测试启动...';
  render();
}

render();
</script>
