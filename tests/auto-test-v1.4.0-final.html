<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Reveal v1.4.0 自动化测试报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .header h1 { 
            font-size: 2.5em; 
            margin-bottom: 10px; 
            background: linear-gradient(135deg, #fbbf24, #f59e0b); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value { font-size: 3em; font-weight: bold; margin-bottom: 5px; }
        .stat-label { color: #94a3b8; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value.passed { color: #22c55e; }
        .stat-value.failed { color: #ef4444; }
        .stat-value.running { color: #3b82f6; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .test-list { display: flex; flex-direction: column; gap: 10px; }
        .test-item {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #475569;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .test-item.passed { border-left-color: #22c55e; }
        .test-item.failed { border-left-color: #ef4444; }
        .test-item.running { border-left-color: #3b82f6; animation: pulse 1.5s infinite; }
        .test-status {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            flex-shrink: 0;
        }
        .test-status.passed { background: #22c55e; color: white; }
        .test-status.failed { background: #ef4444; color: white; }
        .test-status.running { background: #3b82f6; color: white; }
        .test-info { flex: 1; }
        .test-name { font-weight: 600; margin-bottom: 5px; }
        .test-desc { color: #94a3b8; font-size: 0.9em; }
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #22c55e);
            transition: width 0.5s ease;
        }
        .controls { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1e293b; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(251,191,36,0.3); }
        .log-output {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-line { margin-bottom: 5px; }
        .log-line.info { color: #64748b; }
        .log-line.success { color: #22c55e; }
        .log-line.error { color: #ef4444; }
        .live-preview {
            margin-top: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }
        .live-preview iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        .preview-header {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Line Reveal v1.4.0 自动化测试</h1>
            <div class="version">胜利动画完整流程验证</div>
            <div class="timestamp" id="timestamp">测试时间：-</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        </div>
        
        <div class="summary">
            <div class="stat-card">
                <div class="stat-value running" id="totalTests">0</div>
                <div class="stat-label">总测试数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value passed" id="passedTests">0</div>
                <div class="stat-label">通过</div>
            </div>
            <div class="stat-card">
                <div class="stat-value failed" id="failedTests">0</div>
                <div class="stat-label">失败</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingTests" style="color: #fbbf24">0</div>
                <div class="stat-label">待执行</div>
            </div>
        </div>
        
        <div class="section">
            <h2 style="margin-bottom: 20px;">📋 测试用例</h2>
            <div class="test-list" id="testList"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="runAllTests()">▶️ 运行所有测试</button>
            <button class="btn btn-primary" onclick="openLivePreview()">👁️ 打开实时预览</button>
        </div>
        
        <div class="log-output" id="logOutput">
            <div class="log-line info">[系统] 准备就绪，点击"运行所有测试"开始...</div>
        </div>
        
        <div class="live-preview" id="livePreview" style="display: none;">
            <div class="preview-header">🎮 实时预览 - Line Reveal v1.4.0</div>
            <iframe id="previewFrame" src=""></iframe>
        </div>
    </div>
    
    <script>
        const TESTS = [
            { id: 'T01', name: 'Web 构建验证', desc: '检查 dist 目录是否存在', status: 'pending' },
            { id: 'T02', name: 'GameCanvas 组件加载', desc: '验证 GameCanvas 正确挂载', status: 'pending' },
            { id: 'T03', name: '胜利检测逻辑', desc: '验证累计解锁百分比 >= 70% 触发胜利', status: 'pending' },
            { id: 'T04', name: '迷雾消散动画', desc: '验证 winAnimProgress 从 0 到 1（2.5 秒）', status: 'pending' },
            { id: 'T05', name: '径向渐变性能', desc: '验证使用 createRadialGradient（无卡顿）', status: 'pending' },
            { id: 'T06', name: '提示文字显示', desc: '验证 "TAP ANYWHERE TO CONTINUE" 显示', status: 'pending' },
            { id: 'T07', name: '提示闪烁动画', desc: '验证 hintVisible 闪烁（0.5 秒周期）', status: 'pending' },
            { id: 'T08', name: '点击交互回调', desc: '验证 onWonClick 回调触发', status: 'pending' },
            { id: 'T09', name: 'ResultScreen 显示', desc: '验证点击后显示 ResultScreen', status: 'pending' },
            { id: 'T10', name: '无舞蹈动画', desc: '验证无 VictoryDanceScreen 组件', status: 'pending' }
        ];
        
        let testResults = [];
        
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = '测试时间：' + now.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
        }
        
        function addLog(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            line.textContent = `[${time}] ${message}`;
            logOutput.appendChild(line);
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        function renderTestItem(test) {
            const statusIcon = test.status === 'passed' ? '✓' : test.status === 'failed' ? '✗' : test.status === 'running' ? '⟳' : '○';
            return `
                <div class="test-item ${test.status}" id="test-${test.id}">
                    <div class="test-status ${test.status}">${statusIcon}</div>
                    <div class="test-info">
                        <div class="test-name">${test.name}</div>
                        <div class="test-desc">${test.desc}</div>
                        <div class="test-meta" style="font-size: 0.85em; color: #64748b; margin-top: 8px;">
                            <span>ID: ${test.id}</span>
                            <span>状态：${test.status.toUpperCase()}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderTests() {
            document.getElementById('testList').innerHTML = TESTS.map(renderTestItem).join('');
            updateStats();
        }
        
        function updateStats() {
            const total = TESTS.length;
            const passed = TESTS.filter(t => t.status === 'passed').length;
            const failed = TESTS.filter(t => t.status === 'failed').length;
            const pending = TESTS.filter(t => t.status === 'pending').length;
            
            document.getElementById('totalTests').textContent = total;
            document.getElementById('passedTests').textContent = passed;
            document.getElementById('failedTests').textContent = failed;
            document.getElementById('pendingTests').textContent = pending;
            
            const progress = ((passed + failed) / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function setTestStatus(testId, status) {
            const test = TESTS.find(t => t.id === testId);
            if (test) {
                test.status = status;
                const el = document.getElementById(`test-${testId}`);
                if (el) {
                    el.className = `test-item ${status}`;
                    const statusIcon = status === 'passed' ? '✓' : status === 'failed' ? '✗' : '⟳';
                    el.querySelector('.test-status').textContent = statusIcon;
                    el.querySelector('.test-status').className = `test-status ${status}`;
                }
                updateStats();
            }
        }
        
        async function runTest(testId, testFn) {
            setTestStatus(testId, 'running');
            addLog(`开始执行：${testId} - ${TESTS.find(t => t.id === testId).name}`, 'info');
            
            try {
                const result = await testFn();
                setTestStatus(testId, result ? 'passed' : 'failed');
                addLog(`${testId}: ${result ? '通过 ✓' : '失败 ✗'}`, result ? 'success' : 'error');
                return result;
            } catch (error) {
                setTestStatus(testId, 'failed');
                addLog(`${testId}: 异常 - ${error.message}`, 'error');
                return false;
            }
        }
        
        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        
        async function runAllTests() {
            addLog('=== 开始执行所有测试 ===', 'info');
            updateTimestamp();
            
            // T01: Web 构建验证
            await runTest('T01', async () => {
                const response = await fetch('/dist/index.html');
                return response.ok;
            });
            
            // T02: GameCanvas 组件加载
            await runTest('T02', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                return response.ok;
            });
            
            // T03: 胜利检测逻辑
            await runTest('T03', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('cumulativeUnlockedPercent') && code.includes('unlockThreshold');
            });
            
            // T04: 迷雾消散动画
            await runTest('T04', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('winAnimProgress') && code.includes('dt * 0.4');
            });
            
            // T05: 径向渐变性能
            await runTest('T05', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('createRadialGradient');
            });
            
            // T06: 提示文字显示
            await runTest('T06', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('TAP ANYWHERE TO CONTINUE');
            });
            
            // T07: 提示闪烁动画
            await runTest('T07', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('hintVisible') && code.includes('Math.sin');
            });
            
            // T08: 点击交互回调
            await runTest('T08', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes('onWonClick');
            });
            
            // T09: ResultScreen 显示
            await runTest('T09', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return code.includes("status === 'won'") && code.includes('ResultScreen');
            });
            
            // T10: 无舞蹈动画
            await runTest('T10', async () => {
                const response = await fetch('/dist/assets/index-Ck4b6qLJ.js');
                const code = await response.text();
                return !code.includes('VictoryDance') && !code.includes('dancing');
            });
            
            addLog('=== 测试完成 ===', 'success');
        }
        
        function openLivePreview() {
            const preview = document.getElementById('livePreview');
            const frame = document.getElementById('previewFrame');
            preview.style.display = 'block';
            frame.src = '/dist/index.html';
            addLog('已打开实时预览窗口', 'success');
        }
        
        // 初始化
        renderTests();
        updateTimestamp();
    </script>
</body>
</html>
