<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Reveal 自动化测试 v1.2.7</title>
<style>
  body { font-family: system-ui; background:#0f172a; color:#e2e8f0; margin:0; padding:16px; }
  h1 { color:#38bdf8; font-size:1.3em; margin-bottom:4px; }
  .meta { color:#94a3b8; font-size:.8em; margin-bottom:16px; }
  .suite { background:#1e293b; border-radius:12px; padding:12px 16px; margin-bottom:12px; }
  .suite-title { font-weight:700; color:#f1f5f9; font-size:.95em; margin-bottom:8px; letter-spacing:.05em; }
  .test { display:flex; align-items:flex-start; gap:8px; padding:4px 0; border-bottom:1px solid #334155; font-size:.82em; }
  .test:last-child { border-bottom:none; }
  .badge { min-width:52px; text-align:center; border-radius:6px; padding:1px 6px; font-weight:700; font-size:.75em; flex-shrink:0; margin-top:1px; }
  .pass { background:#166534; color:#4ade80; }
  .fail { background:#7f1d1d; color:#fca5a5; }
  .skip { background:#44403c; color:#d6d3d1; }
  .pending { background:#1e3a5f; color:#7dd3fc; }
  .test-name { flex:1; }
  .test-detail { color:#64748b; font-size:.75em; }
  #summary { background:#0ea5e9; color:#fff; border-radius:12px; padding:12px 20px; margin-bottom:16px; font-weight:700; display:none; }
  #summary.fail { background:#dc2626; }
  button { background:#0ea5e9; color:#fff; border:none; border-radius:8px; padding:10px 24px; font-size:.95em; font-weight:700; cursor:pointer; margin-right:8px; }
  button:hover { opacity:.85; }
  .progress { height:4px; background:#334155; border-radius:2px; margin-bottom:16px; overflow:hidden; }
  .progress-bar { height:100%; background:#0ea5e9; transition:width .3s; width:0%; }
</style>
</head>
<body>
<h1>🧪 Line Reveal 自动化测试 v1.2.7</h1>
<div class="meta">基线版本 b553b5d + 完整重构 | 重点：白屏防护 + 碰撞命系统 + Lives UI 位置</div>
<button onclick="runAll()">▶ 开始自动测试</button>
<button onclick="resetAll()">↩ 重置</button>
<div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
<div id="summary"></div>
<div id="suites"></div>

<script>
// ─────────────────────────────────────────────
// 测试数据定义
// ─────────────────────────────────────────────
const SUITES = [
  {
    id: 'LV', title: '命系统 - LivesData 持久化',
    tests: [
      { id:'LV-01', name:'DEFAULT_LIVES 初始5命无冷却', auto: true,
        fn: () => {
          const d = { count:5, cooldownEndsAt:null, consecutiveLosses:0 };
          assert(d.count === 5, '初始命数应为5');
          assert(d.cooldownEndsAt === null, '初始无冷却');
          assert(d.consecutiveLosses === 0, '初始连续耗尽0次');
        }
      },
      { id:'LV-02', name:'spendLife 逐步扣命返回剩余值', auto: true,
        fn: () => {
          const lives = mockLives(5);
          assert(spendLifeMock(lives) === 4, '扣后应剩4');
          assert(spendLifeMock(lives) === 3, '扣后应剩3');
          assert(spendLifeMock(lives) === 0, '扣到0应进冷却');
          assert(lives.count === 0, '命数=0');
          assert(lives.cooldownEndsAt !== null, '应有冷却时间');
        }
      },
      { id:'LV-03', name:'命耗尽冷却递增（1→2→3次）', auto: true,
        fn: () => {
          const COOLDOWNS = [5,15,30,60,120,240,480];
          const lives = mockLives(1);
          lives.consecutiveLosses = 0;
          const cd0 = calcCooldown(lives); // 第1次耗尽 → 5分钟
          assert(cd0 === COOLDOWNS[0] * 60 * 1000, `第1次冷却应为${COOLDOWNS[0]}分钟，got ${cd0/60000}`);
          lives.consecutiveLosses = 1;
          const cd1 = calcCooldown(lives);
          assert(cd1 === COOLDOWNS[1] * 60 * 1000, `第2次冷却应为${COOLDOWNS[1]}分钟`);
          lives.consecutiveLosses = 6;
          const cd6 = calcCooldown(lives);
          assert(cd6 === COOLDOWNS[6] * 60 * 1000, '第7+次冷却应为480分钟');
        }
      },
      { id:'LV-04', name:'冷却中 spendLife 返回-1', auto: true,
        fn: () => {
          const lives = mockLives(0);
          lives.cooldownEndsAt = Date.now() + 999999;
          const r = spendLifeMock(lives);
          assert(r === -1, `冷却中应返回-1，got ${r}`);
        }
      },
      { id:'LV-05', name:'earnLife 加命+取消冷却', auto: true,
        fn: () => {
          const lives = mockLives(0);
          lives.cooldownEndsAt = Date.now() + 999999;
          lives.consecutiveLosses = 3;
          earnLifeMock(lives);
          assert(lives.count === 1, `加命后count=1，got ${lives.count}`);
          assert(lives.cooldownEndsAt === null, '加命后冷却取消');
          assert(lives.consecutiveLosses === 0, '加命后consecutiveLosses重置');
        }
      },
      { id:'LV-06', name:'earnLife 最多20命', auto: true,
        fn: () => {
          const lives = mockLives(20);
          earnLifeMock(lives);
          assert(lives.count === 20, `最多20命，got ${lives.count}`);
        }
      },
      { id:'LV-07', name:'hasLives 冷却结束后返回true', auto: true,
        fn: () => {
          const lives = mockLives(0);
          lives.cooldownEndsAt = Date.now() - 1; // 已过期
          assert(hasLivesMock(lives) === true, '冷却结束应返回true');
        }
      },
      { id:'LV-08', name:'向后兼容：旧存档无livesData自动merge默认值', auto: true,
        fn: () => {
          const old = { fragments:10, unlockedLevels:[1] }; // 无livesData
          const merged = mergeWithDefault(old);
          assert(merged.livesData.count === 5, '旧存档命数应为5');
          assert(merged.livesData.cooldownEndsAt === null, '无冷却');
        }
      },
    ]
  },
  {
    id: 'ENG', title: '引擎碰撞系统',
    tests: [
      { id:'ENG-01', name:'engine 无 this.lives / this.initialLives 字段', auto: true,
        fn: () => {
          // 验证源码中无 this.lives 赋值（通过 fetch 源码文本检查）
          return fetchAndCheck('/assets/', 'engine', text => {
            const hasLivesField = /this\.lives\s*=\s*\d/.test(text) || /this\.initialLives\s*=/.test(text);
            assert(!hasLivesField, 'engine 不应有 this.lives/initialLives 赋值');
          });
        }
      },
      { id:'ENG-02', name:'engine 无 LIVES 文字 Canvas 渲染', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'engine', text => {
            const hasLivesText = /fillText.*LIVES/.test(text);
            assert(!hasLivesText, 'engine 不应 fillText LIVES');
          });
        }
      },
      { id:'ENG-03', name:'engine 有 hitCount 公开字段', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            assert(text.includes('hitCount'), 'engine 应有 hitCount');
          });
        }
      },
      { id:'ENG-04', name:'engine 有 collisionCooldown 防卡位', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            assert(text.includes('collisionCooldown'), '应有 collisionCooldown');
          });
        }
      },
      { id:'ENG-05', name:'abortDraw 独立于 cancelDraw（手指抬起无惩罚）', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            assert(text.includes('abortDraw'), '应有 abortDraw 函数');
          });
        }
      },
    ]
  },
  {
    id: 'WS', title: '白屏防护',
    tests: [
      { id:'WS-01', name:'App.tsx：won/lost 状态不渲染 GameCanvas', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            // 检查 won/lost 分支只渲染 ResultScreen
            assert(text.includes('ResultScreen'), '应有 ResultScreen');
            // 由于是编译后代码，检查关键逻辑存在
            assert(text.includes('gameEndedRef') || text.includes('gameEnded'), '应有 gameEndedRef 防护');
          });
        }
      },
      { id:'WS-02', name:'GameCanvas：triggerEndGame engine.stop() 先于 endGame', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            assert(text.includes('triggerEndGame') || text.includes('gameEndedRef'), 'triggerEndGame 防护存在');
          });
        }
      },
      { id:'WS-03', name:'GameCanvas：syncInterval 首行检查 gameEndedRef', auto: true,
        fn: () => {
          return fetchAndCheck('/assets/', 'index', text => {
            assert(text.includes('syncIntervalRef') || text.includes('syncInterval'), 'syncInterval ref 存在');
          });
        }
      },
      { id:'WS-04', name:'不再有自动章节跳转 setTimeout startGame', manual: true,
        detail: '验证方法：通关第1关，确认不会自动跳到第2关，需手动点 Next'
      },
      { id:'WS-05', name:'endGame 多次调用只执行一次（防重入）', auto: true,
        fn: () => {
          let count = 0;
          const gameEndedRef = { current: false };
          const triggerEndGame = () => {
            if (gameEndedRef.current) return;
            gameEndedRef.current = true;
            count++;
          };
          triggerEndGame(); triggerEndGame(); triggerEndGame();
          assert(count === 1, `endGame 应只执行1次，实际${count}次`);
        }
      },
    ]
  },
  {
    id: 'UI', title: 'LivesDisplay UI',
    tests: [
      { id:'UI-01', name:'LivesDisplay 组件文件存在', auto: true,
        fn: () => {
          return fetch('/').then(r => r.text()).then(html => {
            // 通过 bundle 检查 LivesDisplay
            return fetchAndCheck('/assets/', 'index', text => {
              assert(text.includes('LivesDisplay') || text.includes('HeartIcon') || text.includes('livesData'), 'LivesDisplay 代码存在于 bundle');
            });
          });
        }
      },
      { id:'UI-02', name:'Lives 显示在右上角（不在左边）', manual: true,
        detail: '验证方法：进入游戏，确认命数桃心显示在屏幕右上角 UNDO 按钮左侧，不在左上角'
      },
      { id:'UI-03', name:'5命以内显示实心/空心桃心 SVG', manual: true,
        detail: '验证方法：进游戏默认5命，检查右上角5个桃心全实心；用控制台扣命后变空心'
      },
      { id:'UI-04', name:'冷却中显示💔+倒计时', manual: true,
        detail: '验证方法：命耗尽后右上角显示💔 + MM:SS 倒计时，每秒刷新'
      },
    ]
  },
  {
    id: 'FLOW', title: '游戏流程',
    tests: [
      { id:'FLOW-01', name:'精灵碰玩家 → hitCount++，React扣命，命>0游戏继续', manual: true,
        detail: '验证方法：进第1关，让精灵碰到玩家，确认右上角命数-1，游戏继续（不出FAILED界面）'
      },
      { id:'FLOW-02', name:'命耗尽 → 出现FAILED界面（不白屏）', manual: true,
        detail: '验证方法：命=1时让精灵碰到，确认出现FAILED弹窗，背景有内容不白屏'
      },
      { id:'FLOW-03', name:'精灵连续碰撞：冷却0.5s防双扣', manual: true,
        detail: '验证方法：让精灵停在玩家位置上0.5s，确认只扣1次命而不是无限扣'
      },
      { id:'FLOW-04', name:'手指抬起不扣命（abortDraw）', manual: true,
        detail: '验证方法：开始划线后手指抬起，命数不变'
      },
      { id:'FLOW-05', name:'通关 → 热舞 → UNVEILED（不白屏）', manual: true,
        detail: '验证方法：划线解锁80%+，确认先热舞6秒，再出UNVEILED弹窗，不白屏'
      },
      { id:'FLOW-06', name:'通关奖励+1命', manual: true,
        detail: '验证方法：通关前命=3，通关后命=4'
      },
      { id:'FLOW-07', name:'超时扣1命并出FAILED', manual: true,
        detail: '验证方法：等倒计时归零，确认扣1命+FAILED弹窗'
      },
    ]
  },
  {
    id: 'PERSIST', title: '持久化与向后兼容',
    tests: [
      { id:'PERSIST-01', name:'localStorage 存储包含 livesData', auto: true,
        fn: async () => {
          // 访问 index.html 后检查（仅在游戏页面有 localStorage，这里用 mock 验证接口）
          const key = 'line_reveal_save_v1';
          const raw = localStorage.getItem(key);
          if (!raw) {
            // 没有存档也可以，检查默认值逻辑
            pass('无存档，默认值包含 livesData（已在 LV-08 验证）');
            return;
          }
          const d = JSON.parse(raw);
          assert(typeof d.livesData === 'object', 'livesData 应为对象');
          assert(typeof d.livesData.count === 'number', 'livesData.count 应为数字');
        }
      },
      { id:'PERSIST-02', name:'checkAndRestoreLives：冷却结束自动恢复5命', auto: true,
        fn: () => {
          const lives = { count:0, cooldownEndsAt: Date.now() - 1, consecutiveLosses:2 };
          checkAndRestoreMock(lives);
          assert(lives.count === 5, `冷却结束应恢复5命，got ${lives.count}`);
          assert(lives.cooldownEndsAt === null, '冷却应清空');
        }
      },
      { id:'PERSIST-03', name:'冷却未结束不恢复命', auto: true,
        fn: () => {
          const lives = { count:0, cooldownEndsAt: Date.now() + 999999, consecutiveLosses:2 };
          checkAndRestoreMock(lives);
          assert(lives.count === 0, '冷却中命数不变');
          assert(lives.cooldownEndsAt !== null, '冷却时间不变');
        }
      },
    ]
  },
];

// ─────────────────────────────────────────────
// Mock 实现（镜像 usePersistence 逻辑）
// ─────────────────────────────────────────────
const COOLDOWN_DURATIONS = [5,15,30,60,120,240,480];

function mockLives(count) {
  return { count, cooldownEndsAt: null, consecutiveLosses: 0 };
}

function calcCooldown(lives) {
  const idx = Math.min(lives.consecutiveLosses, COOLDOWN_DURATIONS.length - 1);
  return COOLDOWN_DURATIONS[idx] * 60 * 1000;
}

function spendLifeMock(lives) {
  if (lives.cooldownEndsAt !== null && Date.now() < lives.cooldownEndsAt) return -1;
  const newCount = Math.max(0, lives.count - 1);
  if (newCount === 0) {
    const cd = calcCooldown(lives);
    lives.count = 0;
    lives.cooldownEndsAt = Date.now() + cd;
    lives.consecutiveLosses++;
    return 0;
  }
  lives.count = newCount;
  return newCount;
}

function earnLifeMock(lives) {
  lives.count = Math.min(20, lives.count + 1);
  lives.cooldownEndsAt = null;
  lives.consecutiveLosses = 0;
}

function hasLivesMock(lives) {
  if (lives.count > 0) return true;
  if (lives.cooldownEndsAt !== null && Date.now() >= lives.cooldownEndsAt) return true;
  return false;
}

function checkAndRestoreMock(lives) {
  if (lives.count === 0 && lives.cooldownEndsAt !== null && Date.now() >= lives.cooldownEndsAt) {
    lives.count = 5;
    lives.cooldownEndsAt = null;
  }
}

function mergeWithDefault(old) {
  const DEFAULT_LIVES = { count:5, cooldownEndsAt:null, consecutiveLosses:0 };
  return {
    ...old,
    livesData: old.livesData ? { ...DEFAULT_LIVES, ...old.livesData } : { ...DEFAULT_LIVES }
  };
}

// ─────────────────────────────────────────────
// 工具
// ─────────────────────────────────────────────
function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}

function pass(msg) { /* 明确通过 */ }

async function fetchAndCheck(basePath, keyword, checker) {
  const res = await fetch('/');
  const html = await res.text();
  const matches = [...html.matchAll(/src="([^"]+\.js)"/g)].map(m => m[1]);
  for (const src of matches) {
    if (!src.includes('web-')) {
      const r = await fetch(src);
      const text = await r.text();
      checker(text);
      return;
    }
  }
  throw new Error('找不到主 bundle JS');
}

// ─────────────────────────────────────────────
// 运行器
// ─────────────────────────────────────────────
let results = {};

async function runAll() {
  results = {};
  renderSuites('pending');
  const allTests = SUITES.flatMap(s => s.tests);
  const total = allTests.length;
  let done = 0, passed = 0, failed = 0, skipped = 0;

  for (const suite of SUITES) {
    for (const t of suite.tests) {
      if (t.manual) {
        results[t.id] = { status:'skip', detail: t.detail };
        skipped++;
      } else {
        try {
          const r = t.fn();
          if (r && typeof r.then === 'function') await r;
          results[t.id] = { status:'pass' };
          passed++;
        } catch(e) {
          results[t.id] = { status:'fail', detail: e.message };
          failed++;
        }
      }
      done++;
      document.getElementById('progress-bar').style.width = `${done/total*100}%`;
      renderSuites('running');
      await new Promise(r => setTimeout(r,10));
    }
  }

  const sumEl = document.getElementById('summary');
  sumEl.style.display = 'block';
  sumEl.className = failed > 0 ? 'fail' : '';
  sumEl.textContent = `✅ ${passed} 通过  ❌ ${failed} 失败  ⏭ ${skipped} 手动（共${total}项）`;
}

function resetAll() {
  results = {};
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('summary').style.display = 'none';
  renderSuites('reset');
}

function renderSuites(mode) {
  const container = document.getElementById('suites');
  container.innerHTML = SUITES.map(s => {
    const rows = s.tests.map(t => {
      const r = results[t.id];
      let badge, detail = '';
      if (!r || mode === 'reset') {
        badge = `<span class="badge pending">${t.manual ? 'MANUAL' : 'AUTO'}</span>`;
      } else if (r.status === 'pass') {
        badge = `<span class="badge pass">PASS</span>`;
      } else if (r.status === 'fail') {
        badge = `<span class="badge fail">FAIL</span>`;
        detail = `<div class="test-detail">❌ ${r.detail}</div>`;
      } else {
        badge = `<span class="badge skip">SKIP</span>`;
        detail = `<div class="test-detail">📋 ${r.detail || t.detail || ''}</div>`;
      }
      return `<div class="test">${badge}<div class="test-name"><b>${t.id}</b> ${t.name}${detail}</div></div>`;
    }).join('');
    return `<div class="suite"><div class="suite-title">${s.id} · ${s.title}</div>${rows}</div>`;
  }).join('');
}

renderSuites('reset');
</script>
</body>
</html>
