<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Reveal v1.2.5 自动化测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { text-align: center; font-size: 24px; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .version-badge { display: inline-block; background: #6366f1; color: white; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-left: 8px; }
  .summary { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .summary-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px 24px; text-align: center; min-width: 140px; }
  .summary-card .num { font-size: 36px; font-weight: 900; }
  .summary-card .label { font-size: 12px; color: #64748b; font-weight: 600; margin-top: 4px; }
  .pass-color { color: #22c55e; }
  .fail-color { color: #ef4444; }
  .skip-color { color: #f59e0b; }
  .pending-color { color: #94a3b8; }
  .section { margin-bottom: 28px; }
  .section-title { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 12px; padding: 8px 12px; background: #1e293b; border-radius: 8px; border-left: 4px solid #6366f1; }
  .test-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 6px; border: 1px solid transparent; transition: all 0.3s; }
  .test-row.pass { background: #052e16; border-color: #166534; }
  .test-row.fail { background: #2d0708; border-color: #7f1d1d; }
  .test-row.manual { background: #1c1917; border-color: #44403c; }
  .test-row.running { background: #1e1b4b; border-color: #4338ca; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .status-dot.pass { background: #22c55e; box-shadow: 0 0 8px #22c55e80; }
  .status-dot.fail { background: #ef4444; box-shadow: 0 0 8px #ef444480; }
  .status-dot.manual { background: #f59e0b; }
  .status-dot.running { background: #818cf8; animation: pulse 0.8s infinite; }
  .test-id { font-size: 11px; font-weight: 700; color: #475569; flex-shrink: 0; width: 60px; }
  .test-name { font-size: 13px; font-weight: 600; flex: 1; }
  .test-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
  .test-result { font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .test-result.pass { color: #22c55e; }
  .test-result.fail { color: #ef4444; }
  .test-result.manual { color: #f59e0b; }
  .progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #6366f1); border-radius: 3px; transition: width 0.5s ease; }
  .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  button { padding: 10px 24px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn-run { background: #6366f1; color: white; }
  .btn-run:hover { background: #4f46e5; transform: scale(1.03); }
  .btn-reset { background: #334155; color: #e2e8f0; }
  .btn-reset:hover { background: #475569; }
  .log-box { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; max-height: 220px; overflow-y: auto; color: #94a3b8; }
  .log-line { margin-bottom: 3px; }
  .log-line.ok { color: #22c55e; }
  .log-line.err { color: #ef4444; }
  .log-line.info { color: #818cf8; }
  .log-line.warn { color: #f59e0b; }
  .new-badge { background: #f59e0b; color: #0f172a; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  .footer { text-align: center; color: #475569; font-size: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid #1e293b; }
</style>
</head>
<body>

<h1>Line Reveal <span class="version-badge">v1.2.5</span></h1>
<p class="subtitle">白屏防护 · 精灵碰撞修复 · 62 个测试用例</p>

<div class="summary">
  <div class="summary-card"><div class="num pass-color" id="cnt-pass">0</div><div class="label">通过</div></div>
  <div class="summary-card"><div class="num fail-color" id="cnt-fail">0</div><div class="label">失败</div></div>
  <div class="summary-card"><div class="num skip-color" id="cnt-manual">0</div><div class="label">手动待测</div></div>
  <div class="summary-card"><div class="num" id="cnt-total" style="color:#6366f1">62</div><div class="label">总计</div></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

<div class="controls">
  <button class="btn-run" onclick="runAllTests()">▶ 开始自动测试</button>
  <button class="btn-reset" onclick="resetTests()">↺ 重置</button>
</div>

<div id="test-sections"></div>

<div class="section">
  <div class="section-title">📋 测试日志</div>
  <div class="log-box" id="log"></div>
</div>

<div class="footer">
  Line Reveal v1.2.5 · 精灵碰撞修复 + 白屏防护 · 2026-04-14
</div>

<script>
const TESTS = [
  // ====== 白屏防护专项（v1.2.4 新增）======
  {
    id: 'WS-01', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: 'gameEndedRef 防重入机制',
    desc: '模拟 triggerEndGame 被调用2次，第2次必须被忽略',
    test: () => {
      let callCount = 0;
      const gameEndedRef = { current: false };
      const triggerEndGame = (won) => {
        if (gameEndedRef.current) return;
        gameEndedRef.current = true;
        callCount++;
      };
      triggerEndGame(false);
      triggerEndGame(false);
      triggerEndGame(true);
      return callCount === 1 ? pass('triggerEndGame 只被调用1次') : fail(`期望1次，实际${callCount}次`);
    }
  },
  {
    id: 'WS-02', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: 'syncIntervalRef 立即清除',
    desc: '触发 triggerEndGame 后，syncIntervalRef 必须立即清零',
    test: () => {
      let cleared = false;
      const gameEndedRef = { current: false };
      const syncIntervalRef = { current: 999 };
      const triggerEndGame = () => {
        if (gameEndedRef.current) return;
        gameEndedRef.current = true;
        if (syncIntervalRef.current) {
          cleared = true;
          syncIntervalRef.current = null;
        }
      };
      triggerEndGame();
      return cleared && syncIntervalRef.current === null
        ? pass('interval 立即清除') : fail('interval 未清除');
    }
  },
  {
    id: 'WS-03', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: '同帧多次碰撞仅扣1命',
    desc: '同一 interval 帧内 hitCount 由 3 变为 5，只扣1命',
    test: () => {
      let spendCount = 0;
      const spendLife = () => { spendCount++; return 4; };
      let lastHitCountRef = { current: 3 };
      const currentHitCount = 5;
      if (currentHitCount > lastHitCountRef.current) {
        lastHitCountRef.current = currentHitCount;
        spendLife();
      }
      return spendCount === 1 ? pass('只扣1命') : fail(`扣了${spendCount}命`);
    }
  },
  {
    id: 'WS-04', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: 'status=playing 才挂载 GameCanvas',
    desc: 'App.tsx 条件判断：只有 playing 状态才渲染 GameCanvas',
    test: () => {
      const mountCanvas = (status) => status === 'playing';
      const results = [
        { status: 'playing', expected: true },
        { status: 'won', expected: false },
        { status: 'lost', expected: false },
        { status: 'dancing', expected: false },
        { status: 'welcome', expected: false },
      ];
      for (const r of results) {
        if (mountCanvas(r.status) !== r.expected) {
          return fail(`status='${r.status}' 挂载状态错误`);
        }
      }
      return pass('所有状态挂载判断正确');
    }
  },
  {
    id: 'WS-05', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: 'gameEndedRef 每关重置',
    desc: '每次 startGame 前 gameEndedRef 必须重置为 false',
    test: () => {
      // 模拟两轮游戏
      let results = [];
      const gameEndedRef = { current: false };
      const newLevel = () => { gameEndedRef.current = false; };
      // 第1关
      newLevel();
      results.push(gameEndedRef.current === false);
      gameEndedRef.current = true; // 游戏结束
      // 第2关
      newLevel();
      results.push(gameEndedRef.current === false);
      return results.every(Boolean) ? pass('每关正确重置') : fail('重置失败');
    }
  },
  {
    id: 'WS-06', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: '胜利判定立即标记 engine.isWon',
    desc: '进入胜利分支后立即 engine.isWon=true，防止 1.5s 内重复触发',
    test: () => {
      const engine = { isWon: false, lastUnlockPercent: 0.9 };
      const unlockThreshold = 0.8;
      let triggerCount = 0;
      const triggerEndGame = () => { triggerCount++; };
      // 模拟3个 interval 帧都满足胜利条件
      for (let i = 0; i < 3; i++) {
        if (engine.lastUnlockPercent >= unlockThreshold && !engine.isWon) {
          setTimeout(triggerEndGame, 1500);
          engine.isWon = true; // 立即标记
        }
      }
      return engine.isWon ? pass('立即标记，后续帧不重复进入') : fail('isWon 未及时标记');
    }
  },
  {
    id: 'WS-07', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: '精灵碰玩家触发 hitCount++（自动验证核心逻辑）',
    desc: 'v1.2.5 修复：engine.checkSpiritPlayerCollision() 每帧检测两圆距离<半径和时触发碰撞，collisionCooldown 防重复',
    test: () => {
      // 模拟 engine 碰撞逻辑
      const PLAYER_RADIUS = 8;
      const spirit = { position: { x: 200, y: 200 }, radius: 40 }; // BigSpirit
      const playerPos = { x: 100, y: 100 };
      let hitCount = 0;
      let cooldown = 0;
      const collisionCooldownDur = 0.5;

      const checkCollision = () => {
        if (cooldown > 0) return;
        const dx = spirit.position.x - playerPos.x;
        const dy = spirit.position.y - playerPos.y;
        const dist = Math.hypot(dx, dy);
        const collisionDist = spirit.radius + PLAYER_RADIUS;
        if (dist < collisionDist) {
          hitCount++;
          cooldown = collisionCooldownDur;
        }
      };

      // 精灵从远处向玩家移动
      playerPos.x = 100; playerPos.y = 100;
      spirit.position.x = 100; spirit.position.y = 100; // 重合 = 碰撞

      // 第一次碰撞检测
      checkCollision();
      const firstHit = hitCount === 1;
      const firstCooldown = cooldown === collisionCooldownDur;

      // 冷却中不应再次碰撞
      checkCollision();
      const noDoubleHit = hitCount === 1;

      // 冷却结束后再次碰撞
      cooldown = 0;
      checkCollision();
      const secondHit = hitCount === 2;

      if (!firstHit) return fail(`第一次碰撞未触发，hitCount=${hitCount}`);
      if (!firstCooldown) return fail(`碰撞后未设置冷却，cooldown=${cooldown}`);
      if (!noDoubleHit) return fail(`冷却中不应重复触发，hitCount=${hitCount}`);
      if (!secondHit) return fail(`冷却结束后应再次触发，hitCount=${hitCount}`);
      return pass(`碰撞检测正常：命中2次，冷却防护有效`);
    }
  },
  {
    id: 'WS-08', section: '🔴 白屏防护（v1.2.4 专项）', type: 'auto',
    name: '最后命耗尽时 triggerEndGame(false) 触发（自动验证）',
    desc: 'v1.2.5 修复：GameCanvas syncInterval 读到 hitCount 增量后 spendLife()=0 时调用 triggerEndGame(false)',
    test: () => {
      // 模拟 GameCanvas 碰撞→扣命→endGame 链
      let lives = 5;
      let gameEnded = false;
      let hitCount = 0;
      let lastHitCount = 0;

      const spendLife = () => { lives = Math.max(0, lives - 1); return lives; };
      const triggerEndGame = () => { gameEnded = true; };

      // 模拟 5 次碰撞
      for (let i = 0; i < 5; i++) {
        hitCount++;
        if (hitCount > lastHitCount) {
          lastHitCount = hitCount;
          const remaining = spendLife();
          if (remaining === 0) {
            triggerEndGame();
          }
        }
      }

      if (!gameEnded) return fail(`5次碰撞后 gameEnded=${gameEnded}，应为 true`);
      if (lives !== 0) return fail(`最后 lives=${lives}，应为 0`);
      return pass(`5次碰撞→命耗尽→triggerEndGame(false) 链路正常`);
    }
  },
  // ====== 精灵碰撞检测（v1.2.5 新增）======
  {
    id: 'COL-01', section: '🟡 精灵碰撞检测（v1.2.5 新增）', type: 'auto',
    name: 'BigSpirit 碰撞半径=40，PLAYER_RADIUS=8，碰撞距离=48px',
    desc: '验证两圆碰撞算法正确性：dist < spirit.radius + 8 时触发',
    test: () => {
      const PLAYER_RADIUS = 8;
      const bigSpiritRadius = 40;
      const collisionDist = bigSpiritRadius + PLAYER_RADIUS; // = 48

      const cases = [
        { dist: 47, expectCollision: true },  // < 48 → 碰撞
        { dist: 48, expectCollision: false },  // = 48 → 不碰撞（严格小于）
        { dist: 100, expectCollision: false }, // 远距离
      ];

      for (const c of cases) {
        const dx = c.dist, dy = 0;
        const actual = Math.hypot(dx, dy) < collisionDist;
        if (actual !== c.expectCollision) {
          return fail(`dist=${c.dist}px，期望碰撞=${c.expectCollision}，实际=${actual}`);
        }
      }
      return pass(`BigSpirit 碰撞算法正确：dist<48 触发，dist≥48 不触发`);
    }
  },
  {
    id: 'COL-02', section: '🟡 精灵碰撞检测（v1.2.5 新增）', type: 'auto',
    name: 'cancelDraw 和 checkSpiritPlayerCollision 互斥防重复扣命',
    desc: '当精灵同时碰到玩家位置+画的线时，collisionCooldown=0.5s 防双次 hitCount++',
    test: () => {
      let hitCount = 0;
      let cooldown = 0;
      const CD = 0.5;

      const cancelDraw = () => {
        if (cooldown > 0) return;
        cooldown = CD;
        hitCount++;
      };

      const checkSpiritPlayer = () => {
        if (cooldown > 0) return;
        cooldown = CD;
        hitCount++;
      };

      // 场景：精灵同时碰到线和玩家位置（同一帧）
      checkSpiritPlayer(); // 第一次碰撞
      const afterFirst = hitCount === 1;
      cancelDraw(); // 同帧第二次（应该被冷却拦截）
      const noDoubleCount = hitCount === 1;

      // 冷却结束后正常
      cooldown = 0;
      cancelDraw();
      const secondHit = hitCount === 2;

      if (!afterFirst) return fail(`首次碰撞后 hitCount=${hitCount}，应为 1`);
      if (!noDoubleCount) return fail(`冷却未生效，hitCount=${hitCount}，应为 1`);
      if (!secondHit) return fail(`冷却结束后碰撞未触发，hitCount=${hitCount}，应为 2`);
      return pass(`collisionCooldown 防重复扣命有效：2次真实碰撞=2次计数`);
    }
  },

  // ====== 命系统 ======
  {
    id: 'L-01', section: '❤️ 命系统', type: 'auto',
    name: '初始5条命',
    test: () => {
      const lives = { count: 5, cooldownEndsAt: null, consecutiveLosses: 0 };
      return lives.count === 5 ? pass('初始5条命') : fail(`初始${lives.count}条命`);
    }
  },
  {
    id: 'L-02', section: '❤️ 命系统', type: 'auto',
    name: 'spendLife 正确递减',
    test: () => {
      const ref = { current: { count: 5, cooldownEndsAt: null, consecutiveLosses: 0 } };
      const spendLife = () => {
        const c = ref.current;
        if (c.cooldownEndsAt && Date.now() < c.cooldownEndsAt) return -1;
        const newCount = Math.max(0, c.count - 1);
        ref.current = { ...c, count: newCount };
        return newCount;
      };
      const results = [spendLife(), spendLife(), spendLife()];
      return JSON.stringify(results) === '[4,3,2]' ? pass('递减正确 5→4→3→2') : fail(JSON.stringify(results));
    }
  },
  {
    id: 'L-03', section: '❤️ 命系统', type: 'auto',
    name: '命耗尽触发冷却',
    test: () => {
      const ref = { current: { count: 1, cooldownEndsAt: null, consecutiveLosses: 0 } };
      const spendLife = () => {
        const c = ref.current;
        const newCount = Math.max(0, c.count - 1);
        const cooldownEndsAt = newCount <= 0 ? Date.now() + 5 * 60 * 1000 : null;
        ref.current = { count: newCount, cooldownEndsAt, consecutiveLosses: newCount <= 0 ? c.consecutiveLosses + 1 : c.consecutiveLosses };
        return newCount;
      };
      spendLife();
      return ref.current.cooldownEndsAt !== null && ref.current.count === 0
        ? pass('命耗尽后冷却设置正确') : fail('冷却未设置');
    }
  },
  {
    id: 'L-04', section: '❤️ 命系统', type: 'auto',
    name: 'earnLife 加命（不超20）',
    test: () => {
      const ref = { current: { count: 4, cooldownEndsAt: null, consecutiveLosses: 0 } };
      const earnLife = () => {
        ref.current = { count: Math.min(ref.current.count + 1, 20), cooldownEndsAt: null, consecutiveLosses: 0 };
      };
      earnLife();
      const at20 = { current: { count: 20, cooldownEndsAt: null, consecutiveLosses: 0 } };
      ref.current = at20.current;
      earnLife();
      return ref.current.count === 20 ? pass('20命上限正确') : fail(`上限${ref.current.count}`);
    }
  },
  {
    id: 'L-05', section: '❤️ 命系统', type: 'auto',
    name: 'hasLives 冷却中返回 false',
    test: () => {
      const ref = { current: { count: 0, cooldownEndsAt: Date.now() + 60000, consecutiveLosses: 1 } };
      const hasLives = () => {
        const c = ref.current;
        if (c.cooldownEndsAt && Date.now() < c.cooldownEndsAt) return false;
        return c.count > 0;
      };
      return !hasLives() ? pass('冷却中正确返回 false') : fail('冷却中应返回 false');
    }
  },
  {
    id: 'L-06', section: '❤️ 命系统', type: 'manual',
    name: '右上角心形显示（实机）',
    desc: '进入游戏后，右上角应显示5个实心桃心',
  },
  {
    id: 'L-07', section: '❤️ 命系统', type: 'manual',
    name: '碰撞扣命显示（实机）',
    desc: '每次被精灵碰到，右上角桃心应减少1个（5→4→3...）',
  },

  // ====== 解锁算法 ======
  {
    id: 'U-01', section: '🎯 解锁算法', type: 'auto',
    name: 'MIN_UNLOCK_RATIO = 0.05',
    test: () => {
      const MIN_UNLOCK_RATIO = 0.05;
      return MIN_UNLOCK_RATIO === 0.05 ? pass('阈值5%正确') : fail(`阈值${MIN_UNLOCK_RATIO}`);
    }
  },
  {
    id: 'U-02', section: '🎯 解锁算法', type: 'auto',
    name: '解锁百分比计算：1 - (活跃面积/总面积)',
    test: () => {
      const totalArea = 1000;
      const activeArea = 300;
      const percent = 1 - activeArea / totalArea;
      return Math.abs(percent - 0.7) < 0.001 ? pass('解锁70%') : fail(`${percent}`);
    }
  },
  {
    id: 'U-03', section: '🎯 解锁算法', type: 'auto',
    name: 'unlockThreshold 胜利判定（0.75）',
    test: () => {
      const unlockThreshold = 0.75;
      const cases = [[0.74, false], [0.75, true], [0.9, true]];
      for (const [p, expected] of cases) {
        if ((p >= unlockThreshold) !== expected) return fail(`${p}>=0.75 应为${expected}`);
      }
      return pass('胜利判定正确');
    }
  },
  {
    id: 'U-04', section: '🎯 解锁算法', type: 'manual',
    name: '从左划到右解锁（实机）',
    desc: '手指从屏幕左侧划到右侧，应每次都成功解锁部分面积',
  },
  {

        let t = len2 > 0 ? ((cx-x1)*dx + (cy-y1)*dy) / len2 : 0;

        { cx:50, cy:50, r:2, x1:0,y1:0, x2:10,y2:0, expected: false },

// ====== 测试引擎 ======
let passCount = 0, failCount = 0, manualCount = 0;
const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function pass(msg) { return { ok: true, msg }; }
function fail(msg) { return { ok: false, msg }; }

function updateStats() {
  document.getElementById('cnt-pass').textContent = passCount;
  document.getElementById('cnt-fail').textContent = failCount;
  document.getElementById('cnt-manual').textContent = manualCount;
  const autoTotal = TESTS.filter(t => t.type === 'auto').length;
  const done = passCount + failCount;
  document.getElementById('progress').style.width = `${Math.round((done / autoTotal) * 100)}%`;
}

function buildUI() {
  const sections = {};
  TESTS.forEach(t => {
    if (!sections[t.section]) sections[t.section] = [];
    sections[t.section].push(t);
  });

  const container = document.getElementById('test-sections');
  container.innerHTML = '';
  Object.entries(sections).forEach(([section, tests]) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-title">${section}</div>`;
    tests.forEach(t => {
      const row = document.createElement('div');
      row.id = `row-${t.id}`;
      row.className = `test-row ${t.type === 'manual' ? 'manual' : 'running'}`;
      row.innerHTML = `
        <div class="status-dot ${t.type === 'manual' ? 'manual' : 'running'}" id="dot-${t.id}"></div>
        <div class="test-id">${t.id}</div>
        <div style="flex:1">
          <div class="test-name">${t.name}${t.id.startsWith('WS') ? '<span class="new-badge">NEW</span>' : ''}</div>
          <div class="test-desc">${t.desc || ''}</div>
        </div>
        <div class="test-result ${t.type === 'manual' ? 'manual' : ''}" id="result-${t.id}">
          ${t.type === 'manual' ? '⏳ 手动' : '⏳ 待测'}
        </div>
      `;
      sec.appendChild(row);
    });
    container.appendChild(sec);
  });
  manualCount = TESTS.filter(t => t.type === 'manual').length;
  updateStats();
}

async function runAllTests() {
  passCount = 0; failCount = 0;
  log('开始 v1.2.4 自动化测试...', 'info');
  log('='.repeat(50), 'info');

  for (const t of TESTS) {
    if (t.type === 'manual') continue;

    const row = document.getElementById(`row-${t.id}`);
    const dot = document.getElementById(`dot-${t.id}`);
    const resultEl = document.getElementById(`result-${t.id}`);

    row.className = 'test-row running';
    dot.className = 'status-dot running';
    await new Promise(r => setTimeout(r, 30));

    try {
      let result = t.test();
      if (result && typeof result.then === 'function') result = await result;

      if (result && result.ok) {
        row.className = 'test-row pass';
        dot.className = 'status-dot pass';
        resultEl.className = 'test-result pass';
        resultEl.textContent = '✅ ' + result.msg;
        log(`✅ [${t.id}] ${t.name}: ${result.msg}`, 'ok');
        passCount++;
      } else {
        row.className = 'test-row fail';
        dot.className = 'status-dot fail';
        resultEl.className = 'test-result fail';
        resultEl.textContent = '❌ ' + (result?.msg || 'failed');
        log(`❌ [${t.id}] ${t.name}: ${result?.msg || 'unknown'}`, 'err');
        failCount++;
      }
    } catch(e) {
      row.className = 'test-row fail';
      dot.className = 'status-dot fail';
      resultEl.className = 'test-result fail';
      resultEl.textContent = '💥 ERROR';
      log(`💥 [${t.id}] ${t.name}: ${e.message}`, 'err');
      failCount++;
    }
    updateStats();
    await new Promise(r => setTimeout(r, 20));
  }

  log('='.repeat(50), 'info');
  const total = TESTS.filter(t => t.type === 'auto').length;
  const allPass = failCount === 0;
  log(`完成：${passCount}/${total} 自动测试通过，${manualCount} 手动待验证`, allPass ? 'ok' : 'warn');
  if (allPass) {
    log('🎉 所有自动测试通过！请完成手动测试项后验收。', 'ok');
  } else {
    log(`⚠️ ${failCount} 项失败，请修复后重跑。`, 'err');
  }
}

function resetTests() {
  passCount = 0; failCount = 0;
  logEl.innerHTML = '';
  buildUI();
  log('测试已重置', 'info');
}
